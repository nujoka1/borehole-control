<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 borehole controller low-voltage wiring</title><desc id="desc">GPIO 14 echo through a voltage divider, GPIO 27 trigger, GPIO 26 buzzer, GPIO 25 status LED, and GPIO 33 relay input. Mains pump wiring must be completed by a qualified electrician.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1400" y2="850"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#e8f2ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".14"/></filter></defs><rect width="1400" height="850" rx="32" fill="url(#bg)"/>
  <text x="62" y="68" fill="#10213f" font-family="Arial,sans-serif" font-size="34" font-weight="700">Low-voltage wiring reference</text><text x="62" y="104" fill="#60738e" font-family="Arial,sans-serif" font-size="18">Verify the exact sensor, relay module and ESP32 board revision before power-up.</text>
  <g filter="url(#s)"><rect x="540" y="158" width="330" height="540" rx="28" fill="#102846"/><rect x="62" y="186" width="330" height="250" rx="24" fill="#fff" stroke="#c7d7e9"/><rect x="1004" y="166" width="330" height="280" rx="24" fill="#fff" stroke="#c7d7e9"/><rect x="1004" y="516" width="330" height="190" rx="24" fill="#fff" stroke="#c7d7e9"/></g>
  <g font-family="Arial,sans-serif"><text x="603" y="218" fill="#fff" font-size="28" font-weight="700">ESP32 Dev Module</text><text x="92" y="230" fill="#10213f" font-size="25" font-weight="700">Ultrasonic sensor</text><text x="1034" y="210" fill="#10213f" font-size="25" font-weight="700">Indicators</text><text x="1034" y="559" fill="#10213f" font-size="25" font-weight="700">Relay interface</text>
  <g fill="#dceeff" font-size="19" font-weight="700"><rect x="585" y="270" width="240" height="54" rx="12" fill="#176fd1"/><text x="607" y="304">GPIO 14 - ECHO</text><rect x="585" y="344" width="240" height="54" rx="12" fill="#176fd1"/><text x="607" y="378">GPIO 27 - TRIG</text><rect x="585" y="418" width="240" height="54" rx="12" fill="#176fd1"/><text x="607" y="452">GPIO 26 - BUZZER</text><rect x="585" y="492" width="240" height="54" rx="12" fill="#176fd1"/><text x="607" y="526">GPIO 25 - STATUS LED</text><rect x="585" y="566" width="240" height="54" rx="12" fill="#176fd1"/><text x="607" y="600">GPIO 33 - RELAY IN</text><rect x="585" y="640" width="240" height="38" rx="10" fill="#244360"/><text x="651" y="665" font-size="17">COMMON GND</text></g>
  <g fill="#10213f" font-size="18"><text x="92" y="283">VCC - use manufacturer voltage</text><text x="92" y="326">TRIG to GPIO 27</text><text x="92" y="369">ECHO to GPIO 14 through divider</text><text x="92" y="412">GND to common low-voltage GND</text><text x="1034" y="268">GPIO 26 to suitable buzzer driver</text><text x="1034" y="316">GPIO 25 to LED through resistor</text><text x="1034" y="364">Do not exceed GPIO source current</text><text x="1034" y="412">Use transistor drivers when required</text><text x="1034" y="612">GPIO 33 to isolated relay input</text><text x="1034" y="654">Firmware assumes active HIGH</text></g></g>
  <g fill="none" stroke-width="5"><path d="M392 369h78v-72h70" stroke="#ef9b32"/><path d="M392 326H460v45h80" stroke="#2b9ce8"/><path d="M870 445h134" stroke="#9557d9"/><path d="M870 519h134" stroke="#2dbb75"/><path d="M870 593h134" stroke="#e04a4a"/></g>
  <rect x="62" y="740" width="1272" height="76" rx="16" fill="#fff3e4" stroke="#efb35f"/><text x="92" y="770" fill="#8a4c08" font-family="Arial,sans-serif" font-size="17" font-weight="700">SAFETY: This diagram covers control-side wiring only. A qualified electrician must design the contactor,</text><text x="92" y="797" fill="#8a4c08" font-family="Arial,sans-serif" font-size="17" font-weight="700">overload, breaker, earthing and mains pump circuit.</text>
</svg>
