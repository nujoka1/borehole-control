<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Smart Water Tank system architecture</title>
  <desc id="desc">Local ESP32 control continues independently while authenticated telemetry and commands pass through Supabase to the dashboard and Android app.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1400" y2="720"><stop stop-color="#071326"/><stop offset="1" stop-color="#0b2446"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2787ea"/><stop offset="1" stop-color="#0b4c9b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#65d8ff"/></marker></defs>
  <rect width="1400" height="720" rx="34" fill="url(#bg)"/>
  <text x="70" y="74" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">System architecture</text><text x="70" y="108" fill="#a9bed9" font-family="Arial,sans-serif" font-size="18">Safety-critical pump control remains local to the ESP32.</text>
  <g filter="url(#shadow)"><rect x="62" y="180" width="290" height="390" rx="28" fill="#102846" stroke="#315376"/><rect x="410" y="180" width="290" height="390" rx="28" fill="#102846" stroke="#315376"/><rect x="758" y="180" width="270" height="390" rx="28" fill="#102846" stroke="#315376"/><rect x="1086" y="180" width="252" height="390" rx="28" fill="#102846" stroke="#315376"/></g>
  <g font-family="Arial,sans-serif"><text x="92" y="230" fill="#67dcff" font-size="17" font-weight="700">FIELD HARDWARE</text><text x="440" y="230" fill="#67dcff" font-size="17" font-weight="700">EDGE CONTROLLER</text><text x="788" y="230" fill="#67dcff" font-size="17" font-weight="700">CLOUD BACKEND</text><text x="1116" y="230" fill="#67dcff" font-size="17" font-weight="700">USER INTERFACES</text>
  <g fill="#fff" font-size="22" font-weight="700"><text x="92" y="286">Ultrasonic sensor</text><text x="92" y="368">Relay / contactor</text><text x="92" y="450">Tank and pump</text><text x="440" y="286">ESP32 Dev Module</text><text x="788" y="286">Supabase</text><text x="1116" y="286">React PWA</text><text x="1116" y="412">Android APK</text></g>
  <g fill="#a9bed9" font-size="17"><text x="92" y="317">Distance measurement</text><text x="92" y="399">Isolated pump command</text><text x="92" y="481">Physical water system</text><text x="440" y="317">Filtering and calibration</text><text x="440" y="350">Automatic hysteresis</text><text x="440" y="383">Runtime lockout</text><text x="440" y="416">Offline-safe operation</text><text x="440" y="499">TLS telemetry + polling</text><text x="788" y="317">Authentication + RLS</text><text x="788" y="350">Readings and events</text><text x="788" y="383">Expiring commands</text><text x="788" y="416">Audit records</text><text x="1116" y="317">Monitoring and control</text><text x="1116" y="443">Capacitor application</text></g></g>
  <g fill="none" stroke="#65d8ff" stroke-width="4" marker-end="url(#arrow)"><path d="M352 330H398"/><path d="M700 330H746"/><path d="M1028 330H1074"/></g>
  <path d="M554 582v60H200v-60" fill="none" stroke="#44d7b6" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="252" y="675" fill="#71e8cf" font-family="Arial,sans-serif" font-size="17" font-weight="700">LOCAL CONTROL PATH - NO CLOUD REQUIRED</text>
</svg>
